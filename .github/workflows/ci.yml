name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5


      - name: Scripts are executable in git
        run: |
          set -euo pipefail
          bad=$(git ls-files -s scripts/ tests/ | grep -v '^100755' || true)
          if [ -n "$bad" ]; then
            echo "::error::these files are not marked executable in git (chmod +x on Windows does not record it):"
            echo "$bad"
            exit 1
          fi
          echo "all scripts are mode 100755"

      - name: ShellCheck
        run: shellcheck -x scripts/*.sh tests/*.sh

      - name: Validate action.yml
        run: |
          python3 - <<'PY'
          try:
              import yaml
          except ImportError:
              print("pyyaml not available; skipping schema check")
              raise SystemExit(0)

          with open("action.yml", encoding="utf-8") as fh:
              action = yaml.safe_load(fh)

          assert action["runs"]["using"] == "composite", "must stay a composite action"
          required = {"username", "configVdf", "appId", "publishedFileId", "path"}
          missing = required - set(action["inputs"])
          assert not missing, f"missing inputs: {missing}"
          for name, spec in action["inputs"].items():
              assert spec.get("description"), f"input {name} has no description"
          print(f"action.yml OK: {len(action['inputs'])} inputs, {len(action['runs']['steps'])} steps")
          PY


  # Runs the action the way a consumer does. This is the only job that exercises
  # action.yml itself: calling the scripts with `bash` from a CI step, as the
  # other jobs do, cannot catch a missing exec bit or a wrong action_path. A
  # deliberately invalid appId makes the publish step fail during input
  # validation, before any contact with Steam, so the check stays deterministic
  # and needs no credentials.
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Stage a folder to publish
        run: mkdir -p item && echo "self-test content" > item/file.txt

      - name: Run the action
        id: act
        continue-on-error: true
        uses: ./
        with:
          username: self-test-account
          configVdf: '"InstallConfigStore" { "placeholder" "1" }'
          appId: not-a-number
          publishedFileId: '1'
          path: item
          changeNote: self-test

      - name: The action must reach input validation and fail there
        run: |
          set -euo pipefail
          outcome='${{ steps.act.outcome }}'
          test "$outcome" = failure \
            || { echo "::error::expected the action to fail on a non-numeric appId, got '$outcome'"; exit 1; }

          # STEAMCMD is exported by the install step, so its presence proves that
          # step ran to completion through action.yml rather than dying on exec.
          test -n "${STEAMCMD:-}" \
            || { echo "::error::install step did not export STEAMCMD; action.yml never ran it"; exit 1; }
          test -x "$STEAMCMD" \
            || { echo "::error::$STEAMCMD is missing or not executable"; exit 1; }
          echo "action.yml wiring OK; SteamCMD installed at $STEAMCMD"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Unit tests
        run: bash tests/test-lib.sh

      - name: Integration tests
        run: bash tests/test-publish.sh

  # Proves SteamCMD installs and bootstraps natively on each runner image. This
  # is the half of the action that cannot be stubbed, and it is why the action
  # avoids containers: inside one, Docker 29.4.2's seccomp profile breaks
  # SteamCMD's 32-bit networking entirely.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Report runner
        run: |
          . /etc/os-release && echo "image: $PRETTY_NAME"
          echo "docker: $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo 'n/a')"

      - name: Install SteamCMD
        run: bash scripts/install-steamcmd.sh

      - name: SteamCMD runs and reports a version
        run: |
          set -euo pipefail
          "$STEAMCMD" +quit | tee smoke.log
          grep -qi "steam" smoke.log || { echo "::error::SteamCMD produced no recognizable output"; exit 1; }
